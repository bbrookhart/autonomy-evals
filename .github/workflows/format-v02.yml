name: format-v02-once

on:
  push:
    branches: [research/v0.2-validity-upgrade]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v0.2-validity-upgrade
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff format .
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Apply Ruff formatting to v0.2 branch"
            git push origin HEAD:research/v0.2-validity-upgrade
          fi
